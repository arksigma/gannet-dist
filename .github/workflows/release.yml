# Release pipeline for Gannet. It lives on the PUBLIC arksigma/gannet-dist repo
# so all builds use GitHub's free standard runners (macOS included) instead of
# consuming the source repo's Actions minutes. The canonical copy is
# packaging/dist-repo/.github/workflows/release.yml in arksigma/gannet.
#
# Flow: checkout arksigma/gannet at the given tag -> build darwin/linux
# x86_64/arm64 (Linux through cargo-zigbuild pinned to glibc 2.17) -> package
# gannet_<version>_<platform>.tar.gz with `cargo xtask dist` (CLI, app or
# Gannet.app, reference plugins, licences) -> GitHub release on this repo ->
# Casks/gannet.rb pushed to arksigma/homebrew-tap.
#
# Triggers:
#   - repository_dispatch type "release" with {"tag": "vX.Y.Z"}, sent by the
#     source repo's featherweight dispatcher on tag push
#   - workflow_dispatch with a `tag` input (manual or recovery runs;
#     dry_run=true builds without publishing)
#
# Secrets required on THIS repo:
#   RELEASE_GITHUB_TOKEN       - repo scope incl. arksigma/gannet (source checkout)
#   HOMEBREW_TAP_GITHUB_TOKEN  - repo scope on arksigma/homebrew-tap
# Optional (macOS signing + notarisation; ad-hoc signature otherwise):
#   APPLE_SIGNING_IDENTITY, APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_PASSWORD

name: release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to release (e.g. v0.2.0)"
        required: true
      dry_run:
        description: "Build only, skip publishing"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: write

env:
  SOURCE_REPO: arksigma/gannet
  TAP_REPO: arksigma/homebrew-tap
  RELEASE_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
  CARGO_TERM_COLOR: always

jobs:
  # Cheap preflight so a bad token fails in seconds, not after an hour of
  # builds. Runs on dry runs too, which is how the secrets are checked.
  verify-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Source checkout token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          test "$(gh api "repos/$SOURCE_REPO" --jq .permissions.pull)" = true
          echo "RELEASE_GITHUB_TOKEN can read $SOURCE_REPO"
      - name: Tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          test "$(gh api "repos/$TAP_REPO" --jq .permissions.push)" = true
          echo "HOMEBREW_TAP_GITHUB_TOKEN can push to $TAP_REPO"
      - name: Apple secrets present
        env:
          A1: ${{ secrets.APPLE_CERTIFICATE }}
          A2: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          A3: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A4: ${{ secrets.APPLE_ID }}
          A5: ${{ secrets.APPLE_PASSWORD }}
          A6: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          n=0; for v in A1 A2 A3 A4 A5 A6; do [ -n "${!v}" ] && n=$((n+1)); done
          echo "$n of 6 APPLE_* secrets set"
          if [ "$n" -ne 0 ] && [ "$n" -ne 6 ]; then
            echo "::warning::partial Apple secrets: the app will be signed but maybe not notarised"
          fi

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux_x86_64
            zigbuild: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux_arm64
            zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin_x86_64
            zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin_arm64
            zigbuild: false
    needs: verify-secrets
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: arksigma/gannet
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-wasip2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "no release tag provided" >&2
            exit 1
          fi
          crate_version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          tag_version="${RELEASE_TAG#v}"
          # A dry run may build any branch (e.g. master) to rehearse the pipeline.
          if [[ "${{ inputs.dry_run || 'false' }}" == "true" && ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "dry run of $RELEASE_TAG: using workspace version $crate_version"
            tag_version="$crate_version"
          fi
          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "tag $RELEASE_TAG does not match workspace version $crate_version (run cargo xtask bump)" >&2
            exit 1
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

      - name: Set up Zig
        if: matrix.zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # Nothing links against system libraries: GTK is not used (rfd talks to the
      # XDG portal), winit dlopens X11/Wayland and glow dlopens libGL, so no apt
      # packages are needed and aarch64 cross-builds without a sysroot. zigbuild
      # pins glibc 2.17 so the linux binaries run on old distros.
      - name: Build (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17 -p gannet-cli -p gannet-app

      - name: Build (cargo)
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p gannet-cli -p gannet-app

      - name: Build reference plugins
        run: cargo xtask plugins

      # Portable tarball (+ Gannet.app, ad-hoc or Developer-ID signed, on macOS;
      # AppDir/deb/rpm are skipped because their tools are absent here).
      # Apple secrets reach only the macOS packaging step. An unset secret is an
      # empty string, which sign-and-notarize.sh treats as "skip that stage".
      - name: Package
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
        run: cargo xtask dist --no-build --target ${{ matrix.target }}

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Check the app as shipped: unpack the release tarball.
          check="$(mktemp -d)"
          tar -xzf target/dist/gannet_*_${{ matrix.platform }}.tar.gz -C "$check"
          app="$(find "$check" -maxdepth 3 -name Gannet.app -type d | head -1)"
          test -n "$app" || { echo "Gannet.app missing from the tarball" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Signature)=' || true
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.platform }}
          path: target/dist/gannet_*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ (inputs.dry_run || 'false') != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum ./*.tar.gz > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "Gannet ${version} — API client with viewer plugins and an S3 browser; reads Bruno collections. Source: https://github.com/${SOURCE_REPO}/blob/v${version}/CHANGELOG.md" \
            dist/*

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          sha() { grep "gannet_${version}_$1.tar.gz" dist/checksums.txt | cut -d' ' -f1; }

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/gannet.rb <<EOF
          # This file was generated by the gannet release workflow. DO NOT EDIT.
          cask "gannet" do
            version "${version}"

            on_macos do
              on_intel do
                sha256 "$(sha darwin_x86_64)"
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gannet_#{version}_darwin_x86_64.tar.gz"
              end
              on_arm do
                sha256 "$(sha darwin_arm64)"
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gannet_#{version}_darwin_arm64.tar.gz"
              end

              app "Gannet.app"
              binary "gannet"
              binary "#{appdir}/Gannet.app/Contents/MacOS/gannet-app", target: "gannet-app"
            end

            on_linux do
              on_intel do
                sha256 "$(sha linux_x86_64)"
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gannet_#{version}_linux_x86_64.tar.gz"
              end
              on_arm do
                sha256 "$(sha linux_arm64)"
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gannet_#{version}_linux_arm64.tar.gz"
              end

              binary "gannet"
              binary "gannet-app"

              caveats <<~CAVEATS
                Casks cannot install desktop files on Linux. To add Gannet to your
                application menu with its icon run:
                  gannet-app --install-desktop-entry
              CAVEATS
            end

            name "Gannet"
            desc "API client with viewer plugins and an S3 browser; reads Bruno collections"
            homepage "https://github.com/arksigma/gannet"

            livecheck do
              skip "Auto-generated on release."
            end

            zap trash: [
              "~/.config/gannet",
              "~/.local/share/gannet",
              "~/Library/Application Support/gannet",
            ]
          end
          EOF

          cd tap
          git config user.name "releasebot"
          git config user.email "bot@users.noreply.github.com"
          git add Casks/gannet.rb
          git commit -m "Cask update for gannet version ${RELEASE_TAG}"
          git push
